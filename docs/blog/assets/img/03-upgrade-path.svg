<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t6 d6">
  <title id="t6">Star Tracker Loop 构件升级路线图</title>
  <desc id="d6">从只有 Scheduling 的 Hello World 出发，逐步加 Memory（趋势分析）、MCP（看到谁 star 了）、Sub-agent（自动写周报）、Skills（运营策略），形成越来越强大的 Loop。</desc>
  <style>
    .node { rx: 10; stroke-width: 1.5; }
    .node-label { fill: #fff; font-weight: 600; font-size: 14px; text-anchor: middle; }
    .node-sub { fill: rgba(255,255,255,.8); font-size: 11px; text-anchor: middle; }
    .edge { stroke: #9aa0ad; stroke-width: 2; fill: none; marker-end: url(#a6); }
    .tag { rx: 4; }
    .tag-label { fill: #fff; font-size: 10px; text-anchor: middle; font-weight: 600; }
    .anno { fill: #888; font-size: 11px; }
  </style>
  <defs>
    <marker id="a6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#9aa0ad"/></marker>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#fafbfc" rx="8"/>
  <text x="360" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">Star Tracker Loop — 构件升级路线图</text>

  <!-- Level 0: Hello World -->
  <rect x="250" y="55" width="220" height="60" class="node" stroke="#0a7c2e" fill="#0a7c2e"/>
  <text x="360" y="82" class="node-label">Hello World</text>
  <text x="360" y="100" class="node-sub">30 行脚本 · /loop 30m · CSV</text>
  <rect x="480" y="65" width="85" height="20" class="tag" fill="#4f97ff"/>
  <text x="522" y="79" class="tag-label">Scheduling</text>

  <!-- Edges from Hello World -->
  <line x1="290" y1="115" x2="160" y2="165" class="edge"/>
  <line x1="430" y1="115" x2="560" y2="165" class="edge"/>

  <!-- Level 1 Left: +Memory -->
  <rect x="50" y="165" width="220" height="60" class="node" stroke="#1a2233" fill="#1a2233"/>
  <text x="160" y="192" class="node-label">+ Memory</text>
  <text x="160" y="210" class="node-sub">趋势分析 · 跨周期学习</text>
  <rect x="280" y="175" width="70" height="20" class="tag" fill="#1a2233" stroke="#888" stroke-width="1"/>
  <text x="315" y="189" class="tag-label">Memory</text>

  <!-- Level 1 Right: +MCP -->
  <rect x="450" y="165" width="220" height="60" class="node" stroke="#7ab2ff" fill="#7ab2ff"/>
  <text x="560" y="192" class="node-label">+ MCP</text>
  <text x="560" y="210" class="node-sub">看到谁 star 了 · 分析传播路径</text>
  <rect x="390" y="175" width="52" height="20" class="tag" fill="#7ab2ff" stroke="#4f97ff" stroke-width="1"/>
  <text x="416" y="189" class="tag-label">MCP</text>

  <!-- Level 2: +Sub-agent -->
  <line x1="160" y1="225" x2="310" y2="275" class="edge"/>
  <line x1="560" y1="225" x2="410" y2="275" class="edge"/>
  <rect x="250" y="275" width="220" height="60" class="node" stroke="#c75050" fill="#c75050"/>
  <text x="360" y="302" class="node-label">+ Sub-agent</text>
  <text x="360" y="320" class="node-sub">自动写增长周报 · ASCII 图表</text>
  <rect x="480" y="285" width="80" height="20" class="tag" fill="#c75050" stroke="#fff" stroke-width="1"/>
  <text x="520" y="299" class="tag-label">Sub-agent</text>

  <!-- Note: no worktree -->
  <text x="360" y="370" class="anno" text-anchor="middle" font-style="italic">不需要 Worktree —— 这个 Loop 不改代码</text>
  <text x="360" y="388" class="anno" text-anchor="middle">按需加构件，不要为了"完整"而加</text>
</svg>
