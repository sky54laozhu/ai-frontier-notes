<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-bl d-bl">
  <title id="t-bl">Build Loop 内部子循环</title>
  <desc id="d-bl">Build Loop 按任务列表顺序执行。对每个任务：写代码 → 跑测试 → 通过则提交并进入下一个任务；失败则读错误、修复、重试（最多 3 轮）；3 轮都失败则记录到 Memory 跳过。</desc>
  <style>
    .box { rx: 10; stroke-width: 1.5; }
    .box-label { fill: #fff; font-weight: 600; font-size: 13px; text-anchor: middle; }
    .box-sub { fill: rgba(255,255,255,.8); font-size: 10.5px; text-anchor: middle; }
    .flow { stroke: #1a2233; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .flow-ok { stroke: #0a7c2e; stroke-width: 2; fill: none; marker-end: url(#ab-g); }
    .flow-fail { stroke: #c75050; stroke-width: 2; fill: none; marker-end: url(#ab-r); }
    .flow-retry { stroke: #e8a838; stroke-width: 2; fill: none; marker-end: url(#ab-y); stroke-dasharray: 6 4; }
    .diamond { fill: #e8a838; stroke: #1a2233; stroke-width: 1.5; }
    .dia-label { fill: #fff; font-weight: 600; font-size: 12px; text-anchor: middle; }
    .result { rx: 10; stroke-width: 1.5; }
    .result-label { font-weight: 600; font-size: 12px; text-anchor: middle; }
    .badge { fill: #fff; font-size: 10px; text-anchor: middle; font-weight: 600; }
    .anno { fill: #888; font-size: 11px; }
  </style>
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#1a2233"/></marker>
    <marker id="ab-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#0a7c2e"/></marker>
    <marker id="ab-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c75050"/></marker>
    <marker id="ab-y" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e8a838"/></marker>
  </defs>

  <rect x="0" y="0" width="780" height="400" fill="#fafbfc" rx="8"/>
  <text x="390" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">Build Loop — 每个任务的内部循环</text>

  <!-- Task queue -->
  <rect x="30" y="60" width="130" height="55" class="box" stroke="#1a2233" fill="#1a2233"/>
  <text x="95" y="84" class="box-label">任务队列</text>
  <text x="95" y="100" class="box-sub">从 plan.md 读取</text>
  <line x1="160" y1="87" x2="200" y2="87" class="flow"/>

  <!-- Write code -->
  <rect x="200" y="60" width="120" height="55" class="box" stroke="#1a2233" fill="#4f97ff"/>
  <text x="260" y="84" class="box-label">写代码</text>
  <text x="260" y="100" class="box-sub">实现 + 写测试</text>
  <line x1="320" y1="87" x2="360" y2="87" class="flow"/>

  <!-- Run tests -->
  <rect x="360" y="60" width="120" height="55" class="box" stroke="#1a2233" fill="#7ab2ff"/>
  <text x="420" y="84" class="box-label">跑测试</text>
  <text x="420" y="100" class="box-sub">test + typecheck</text>
  <line x1="480" y1="87" x2="520" y2="87" class="flow"/>

  <!-- Decision: pass? -->
  <polygon points="570,57 620,87 570,117 520,87" class="diamond"/>
  <text x="570" y="90" class="dia-label">通过？</text>

  <!-- YES → commit -->
  <line x1="620" y1="87" x2="660" y2="87" class="flow-ok"/>
  <rect x="660" y="60" width="100" height="55" class="result" stroke="#0a7c2e" fill="#e8f5ec"/>
  <text x="710" y="82" class="result-label" fill="#0a7c2e">✓ 提交</text>
  <text x="710" y="100" fill="#0a7c2e" font-size="10.5" text-anchor="middle">标记完成</text>
  <text x="628" y="78" fill="#0a7c2e" font-size="10" font-weight="600">YES</text>

  <!-- Loop back from commit to task queue -->
  <path d="M710,115 L710,145 L95,145 L95,115" class="flow-ok" stroke-dasharray="6 4" marker-end="none"/>
  <text x="400" y="140" class="anno" text-anchor="middle">下一个任务</text>

  <!-- NO → retry decision -->
  <line x1="570" y1="117" x2="570" y2="175" class="flow-fail"/>
  <text x="582" y="150" fill="#c75050" font-size="10" font-weight="600">NO</text>

  <!-- Retry diamond -->
  <polygon points="570,175 630,210 570,245 510,210" class="diamond"/>
  <text x="570" y="207" class="dia-label">重试</text>
  <text x="570" y="222" class="dia-label">≤3?</text>

  <!-- Retry YES → read error + fix → back to run tests -->
  <line x1="510" y1="210" x2="420" y2="210" class="flow-retry"/>
  <rect x="310" y="190" width="110" height="45" class="box" stroke="#e8a838" fill="#fff5e6"/>
  <text x="365" y="210" fill="#e8a838" font-weight="600" font-size="12" text-anchor="middle">读错误 → 修复</text>
  <text x="365" y="226" fill="#e8a838" font-size="10" text-anchor="middle">Round 2, 3...</text>
  <path d="M365,190 L365,115" class="flow-retry"/>
  <text x="490" y="200" fill="#e8a838" font-size="10" font-weight="600">YES</text>

  <!-- Retry NO → record failure -->
  <line x1="630" y1="210" x2="680" y2="210" class="flow-fail"/>
  <rect x="660" y="188" width="100" height="45" class="result" stroke="#c75050" fill="#fce8e8"/>
  <text x="710" y="207" class="result-label" fill="#c75050">✗ 记录失败</text>
  <text x="710" y="223" fill="#c75050" font-size="10" text-anchor="middle">写 Memory</text>
  <text x="655" y="200" fill="#c75050" font-size="10" font-weight="600">NO</text>

  <!-- Failure loops back to task queue -->
  <path d="M710,233 L710,290 L95,290 L95,115" class="flow-fail" stroke-dasharray="6 4" marker-end="none"/>
  <text x="400" y="285" class="anno" text-anchor="middle">跳过，进入下一个任务（Memory 记录了失败原因）</text>

  <!-- Example box -->
  <rect x="30" y="320" width="720" height="60" rx="8" fill="#eef4ff" stroke="#4f97ff" stroke-width="1"/>
  <text x="50" y="342" fill="#4f97ff" font-weight="600" font-size="12">实例：Task 3 (POST /api/shorten)</text>
  <text x="50" y="360" fill="#666" font-size="11">Round 1: 写代码 → 测试挂了（短码冲突没处理） → Round 2: 加冲突重试 → 测试全通过 ✓ → 提交</text>
</svg>
