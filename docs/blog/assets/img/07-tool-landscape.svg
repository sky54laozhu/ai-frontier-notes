<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-tl d-tl">
  <title id="t-tl">模型编排工具全景对比</title>
  <desc id="d-tl">六种工具/方案的能力矩阵：CC Switch、Claude Code Router、ccproxy、OpenRouter、LiteLLM、脚本编排，按多 Provider、自动路由、按阶段切、GUI、成本追踪五个维度对比</desc>
  <style>
    .hdr { fill: #1a2233; font-weight: 700; font-size: 12px; }
    .hdr-center { fill: #1a2233; font-weight: 700; font-size: 12px; text-anchor: middle; }
    .cell { fill: #333; font-size: 11px; }
    .cell-center { fill: #333; font-size: 11px; text-anchor: middle; }
    .yes { fill: #0a7c2e; font-weight: 700; font-size: 12px; text-anchor: middle; }
    .no { fill: #c75050; font-size: 11px; text-anchor: middle; }
    .partial { fill: #e8a838; font-weight: 600; font-size: 11px; text-anchor: middle; }
    .row-bg-even { fill: #f5f7fa; }
    .row-bg-odd { fill: #fff; }
    .anno { fill: #888; font-size: 11px; text-anchor: middle; }
    .badge { rx: 6; }
    .badge-text { fill: #fff; font-weight: 600; font-size: 9px; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="860" height="380" fill="#fafbfc" rx="8"/>
  <text x="430" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">模型编排工具全景对比</text>

  <!-- Table Header -->
  <rect x="20" y="45" width="820" height="30" rx="6" fill="#4f97ff"/>
  <text x="110" y="65" fill="#fff" font-weight="700" font-size="12" text-anchor="middle">工具</text>
  <text x="250" y="65" fill="#fff" font-weight="700" font-size="12" text-anchor="middle">定位</text>
  <text x="390" y="65" fill="#fff" font-weight="700" font-size="12" text-anchor="middle">多 Provider</text>
  <text x="490" y="65" fill="#fff" font-weight="700" font-size="12" text-anchor="middle">自动路由</text>
  <text x="590" y="65" fill="#fff" font-weight="700" font-size="12" text-anchor="middle">按阶段切</text>
  <text x="680" y="65" fill="#fff" font-weight="700" font-size="12" text-anchor="middle">GUI</text>
  <text x="775" y="65" fill="#fff" font-weight="700" font-size="12" text-anchor="middle">成本追踪</text>

  <!-- Row 1: CC Switch -->
  <rect x="20" y="78" width="820" height="38" class="row-bg-odd"/>
  <text x="110" y="101" class="hdr-center">CC Switch</text>
  <text x="250" y="101" class="cell-center">桌面管理器</text>
  <text x="390" y="101" class="yes">50+ 预置</text>
  <text x="490" y="101" class="partial">故障转移</text>
  <text x="590" y="101" class="no">✗ 手动切</text>
  <text x="680" y="101" class="yes">✓</text>
  <text x="775" y="101" class="yes">✓</text>

  <!-- Row 2: Claude Code Router -->
  <rect x="20" y="116" width="820" height="38" class="row-bg-even"/>
  <text x="110" y="139" class="hdr-center">CC Router</text>
  <rect x="155" y="128" width="56" height="16" class="badge" fill="#c75050"/>
  <text x="183" y="140" class="badge-text">31.4k ★</text>
  <text x="250" y="139" class="cell-center">本地代理</text>
  <text x="390" y="139" class="yes">规则路由</text>
  <text x="490" y="139" class="yes">按任务类型</text>
  <text x="590" y="139" class="no">✗ 按请求</text>
  <text x="680" y="139" class="no">✗ CLI</text>
  <text x="775" y="139" class="partial">基础</text>

  <!-- Row 3: ccproxy -->
  <rect x="20" y="154" width="820" height="38" class="row-bg-odd"/>
  <text x="110" y="177" class="hdr-center">ccproxy</text>
  <text x="250" y="177" class="cell-center">高级代理</text>
  <text x="390" y="177" class="yes">Hook 管线</text>
  <text x="490" y="177" class="yes">DAG 动态</text>
  <text x="590" y="177" class="no">✗ 按请求</text>
  <text x="680" y="177" class="no">✗ CLI</text>
  <text x="775" y="177" class="no">✗</text>

  <!-- Row 4: OpenRouter -->
  <rect x="20" y="192" width="820" height="38" class="row-bg-even"/>
  <text x="110" y="215" class="hdr-center">OpenRouter</text>
  <text x="250" y="215" class="cell-center">云端网关</text>
  <text x="390" y="215" class="yes">500+ 模型</text>
  <text x="490" y="215" class="yes">ML Auto</text>
  <text x="590" y="215" class="no">✗ 按 prompt</text>
  <text x="680" y="215" class="partial">Web</text>
  <text x="775" y="215" class="yes">✓</text>

  <!-- Row 5: LiteLLM -->
  <rect x="20" y="230" width="820" height="38" class="row-bg-odd"/>
  <text x="110" y="253" class="hdr-center">LiteLLM</text>
  <text x="250" y="253" class="cell-center">企业代理</text>
  <text x="390" y="253" class="yes">API 翻译</text>
  <text x="490" y="253" class="partial">负载均衡</text>
  <text x="590" y="253" class="no">✗ 按请求</text>
  <text x="680" y="253" class="partial">Web</text>
  <text x="775" y="253" class="yes">✓</text>

  <!-- Row 6: Script Orchestration (highlighted) -->
  <rect x="20" y="268" width="820" height="38" rx="0" fill="#e8f5e9" stroke="#0a7c2e" stroke-width="1.5"/>
  <text x="110" y="291" fill="#0a7c2e" font-weight="700" font-size="12" text-anchor="middle">脚本编排</text>
  <text x="250" y="291" fill="#0a7c2e" font-size="11" text-anchor="middle">claude -p 流水线</text>
  <text x="390" y="291" class="yes">via 环境变量</text>
  <text x="490" y="291" class="yes">写死在脚本</text>
  <text x="590" y="291" class="yes">✓ 唯一方案</text>
  <text x="680" y="291" class="no">✗</text>
  <text x="775" y="291" class="partial">--max-budget</text>

  <!-- Summary -->
  <rect x="60" y="320" width="740" height="44" rx="10" fill="#fff" stroke="#4f97ff" stroke-width="1.5"/>
  <text x="430" y="339" fill="#1a2233" font-weight="600" font-size="12" text-anchor="middle">推荐组合：CC Switch（日常一键切）+ 脚本编排（CI/批量按阶段自动切）</text>
  <text x="430" y="355" fill="#666" font-size="10" text-anchor="middle">需要多厂商模型 → 加 OpenRouter 或 LiteLLM | 需要请求级路由 → 加 Claude Code Router</text>
</svg>
