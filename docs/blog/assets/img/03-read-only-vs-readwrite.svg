<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t7 d7">
  <title id="t7">只读 Loop vs 读写 Loop 对比</title>
  <desc id="d7">对比只读 Loop（Star Tracker）和读写 Loop（Auto-Fix）在风险、构件数、入门难度、最坏后果等维度上的差异。只读 Loop 是 Loop Engineering 的 Hello World。</desc>
  <style>
    .col-head { fill: #fff; font-weight: 600; font-size: 14px; text-anchor: middle; }
    .row-head { fill: #1a1a1a; font-weight: 600; font-size: 13px; }
    .cell { font-size: 13px; text-anchor: middle; }
    .good { fill: #0a7c2e; font-weight: 600; }
    .warn { fill: #c75050; font-weight: 600; }
    .meh { fill: #8c6d1f; font-weight: 600; }
    .grid { stroke: #d0d3d8; stroke-width: 1; }
    .winner-bg { fill: #e8f5ec; }
  </style>

  <rect x="0" y="0" width="720" height="340" fill="#fafbfc" rx="8"/>
  <text x="360" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">只读 Loop vs 读写 Loop —— 从哪个开始？</text>

  <!-- Winner column -->
  <rect x="200" y="55" width="220" height="240" class="winner-bg"/>

  <!-- Header -->
  <rect x="20" y="55" width="180" height="40" fill="#1a2233"/>
  <rect x="200" y="55" width="220" height="40" fill="#0a7c2e"/>
  <rect x="420" y="55" width="280" height="40" fill="#4f97ff"/>

  <text x="110" y="80" class="col-head">维度</text>
  <text x="310" y="73" class="col-head">Star Tracker（只读）</text>
  <text x="310" y="88" class="col-head" font-size="11" font-weight="400">本篇 Hello World</text>
  <text x="560" y="73" class="col-head">Auto-Fix（读写）</text>
  <text x="560" y="88" class="col-head" font-size="11" font-weight="400">第 02 篇</text>

  <!-- Row 1 -->
  <text x="32" y="118" class="row-head">风险等级</text>
  <text x="310" y="118" class="cell good">零风险（只查 API 写 CSV）</text>
  <text x="560" y="118" class="cell warn">中风险（改代码、提 PR）</text>
  <line x1="20" y1="130" x2="700" y2="130" class="grid"/>

  <!-- Row 2 -->
  <text x="32" y="153" class="row-head">构件数量</text>
  <text x="310" y="153" class="cell good">1 个（Scheduling）</text>
  <text x="560" y="153" class="cell meh">5+1（全部）</text>
  <line x1="20" y1="165" x2="700" y2="165" class="grid"/>

  <!-- Row 3 -->
  <text x="32" y="188" class="row-head">入门耗时</text>
  <text x="310" y="188" class="cell good">10 分钟</text>
  <text x="560" y="188" class="cell meh">5 天</text>
  <line x1="20" y1="200" x2="700" y2="200" class="grid"/>

  <!-- Row 4 -->
  <text x="32" y="223" class="row-head">最坏后果</text>
  <text x="310" y="223" class="cell good">多一行错误 CSV 数据</text>
  <text x="560" y="223" class="cell warn">错误的 PR 被合并</text>
  <line x1="20" y1="235" x2="700" y2="235" class="grid"/>

  <!-- Row 5 -->
  <text x="32" y="258" class="row-head">学到什么</text>
  <text x="310" y="258" class="cell">Loop 的节奏感 · 状态累积</text>
  <text x="560" y="258" class="cell">完整 Loop 工程实践</text>
  <line x1="20" y1="270" x2="700" y2="270" class="grid"/>

  <!-- Row 6: Recommendation -->
  <text x="32" y="287" class="row-head">推荐顺序</text>
  <text x="310" y="287" class="cell good" font-size="15">① 先从这里开始</text>
  <text x="560" y="287" class="cell meh">② 跑通后再升级</text>

  <rect x="20" y="55" width="680" height="240" fill="none" stroke="#1a2233" stroke-width="1.5"/>

  <!-- Bottom -->
  <text x="360" y="325" text-anchor="middle" fill="#888" font-size="11">学骑自行车应该先在平地上练，不是先上坡。Star Tracker 就是那块平地。</text>
</svg>
