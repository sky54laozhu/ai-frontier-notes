<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-rt d-rt">
  <title id="t-rt">卡顿恢复工具箱</title>
  <desc id="d-rt">三层恢复策略：即时恢复（0-30 秒）、诊断恢复（1-3 分钟）、预防措施（长期）。</desc>
  <style>
    .layer { rx: 12; stroke-width: 1.5; }
    .layer-title { fill: #fff; font-weight: 700; font-size: 14px; }
    .layer-time { fill: rgba(255,255,255,.7); font-size: 11px; }
    .item { rx: 8; stroke-width: 1; }
    .item-title { font-weight: 600; font-size: 12px; text-anchor: middle; }
    .item-desc { font-size: 10px; text-anchor: middle; fill: #555; }
    .anno { fill: #888; font-size: 11px; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="860" height="400" fill="#fafbfc" rx="8"/>
  <text x="430" y="30" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">卡顿恢复工具箱 — 三层策略</text>

  <!-- Layer 1: Immediate -->
  <rect x="20" y="50" width="120" height="130" class="layer" fill="#c75050" stroke="#c75050"/>
  <text x="35" y="75" class="layer-title">即时</text>
  <text x="35" y="92" class="layer-time">0-30s</text>

  <rect x="155" y="55" width="155" height="55" class="item" fill="#fff" stroke="#c75050"/>
  <text x="232" y="75" class="item-title" fill="#c75050">按 Enter 试探</text>
  <text x="232" y="92" class="item-desc">排除 UI 假死</text>
  <text x="232" y="104" class="item-desc">最快最无害</text>

  <rect x="325" y="55" width="155" height="55" class="item" fill="#fff" stroke="#c75050"/>
  <text x="402" y="75" class="item-title" fill="#c75050">Esc 中断</text>
  <text x="402" y="92" class="item-desc">中断当前请求</text>
  <text x="402" y="104" class="item-desc">保留上下文</text>

  <rect x="495" y="55" width="155" height="55" class="item" fill="#fff" stroke="#c75050"/>
  <text x="572" y="75" class="item-title" fill="#c75050">重新发送</text>
  <text x="572" y="92" class="item-desc">Esc 后重试同一请求</text>
  <text x="572" y="104" class="item-desc">多数情况立刻恢复</text>

  <rect x="665" y="55" width="170" height="55" class="item" fill="#fff" stroke="#c75050"/>
  <text x="750" y="75" class="item-title" fill="#c75050">/model sonnet</text>
  <text x="750" y="92" class="item-desc">切换模型绕过</text>
  <text x="750" y="104" class="item-desc">特定模型故障时有效</text>

  <!-- Layer 2: Diagnostic -->
  <rect x="20" y="195" width="120" height="130" class="layer" fill="#e8a838" stroke="#e8a838"/>
  <text x="35" y="220" class="layer-title">诊断</text>
  <text x="35" y="237" class="layer-time">1-3 min</text>

  <rect x="155" y="200" width="155" height="55" class="item" fill="#fff" stroke="#e8a838"/>
  <text x="232" y="220" class="item-title" fill="#e8a838">/doctor</text>
  <text x="232" y="237" class="item-desc">自动化全面检查</text>
  <text x="232" y="249" class="item-desc">MCP / Hook / 配置</text>

  <rect x="325" y="200" width="155" height="55" class="item" fill="#fff" stroke="#e8a838"/>
  <text x="402" y="220" class="item-title" fill="#e8a838">--safe-mode</text>
  <text x="402" y="237" class="item-desc">claude --safe-mode</text>
  <text x="402" y="249" class="item-desc">禁用 MCP/Hook 排查</text>

  <rect x="495" y="200" width="155" height="55" class="item" fill="#fff" stroke="#e8a838"/>
  <text x="572" y="220" class="item-title" fill="#e8a838">status.anthropic.com</text>
  <text x="572" y="237" class="item-desc">检查 API 服务状态</text>
  <text x="572" y="249" class="item-desc">模型特定的降级</text>

  <rect x="665" y="200" width="170" height="55" class="item" fill="#fff" stroke="#e8a838"/>
  <text x="750" y="220" class="item-title" fill="#e8a838">检查 settings.json</text>
  <text x="750" y="237" class="item-desc">删除自定义超时值</text>
  <text x="750" y="249" class="item-desc">使用默认配置</text>

  <!-- Layer 3: Prevention -->
  <rect x="20" y="340" width="120" height="50" class="layer" fill="#0a7c2e" stroke="#0a7c2e"/>
  <text x="35" y="365" class="layer-title">预防</text>
  <text x="35" y="380" class="layer-time">长期</text>

  <rect x="155" y="340" width="155" height="50" class="item" fill="#fff" stroke="#0a7c2e"/>
  <text x="232" y="360" class="item-title" fill="#0a7c2e">主动 /compact</text>
  <text x="232" y="377" class="item-desc">Token 接近上限前压缩</text>

  <rect x="325" y="340" width="155" height="50" class="item" fill="#fff" stroke="#0a7c2e"/>
  <text x="402" y="360" class="item-title" fill="#0a7c2e">短 session 策略</text>
  <text x="402" y="377" class="item-desc">避免 mega-session</text>

  <rect x="495" y="340" width="155" height="50" class="item" fill="#fff" stroke="#0a7c2e"/>
  <text x="572" y="360" class="item-title" fill="#0a7c2e">避免读超大文件</text>
  <text x="572" y="377" class="item-desc">单文件 &lt; 25K Token</text>

  <rect x="665" y="340" width="170" height="50" class="item" fill="#fff" stroke="#0a7c2e"/>
  <text x="750" y="360" class="item-title" fill="#0a7c2e">不设超时环境变量</text>
  <text x="750" y="377" class="item-desc">使用 Claude Code 默认值</text>
</svg>
