<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-fc d-fc">
  <title id="t-fc">阶段间信息传递：文件链</title>
  <desc id="d-fc">每个 Phase 的产出文件是下一个 Phase 的输入：spec.md → plan.md → src/ + tests/ → review.md → acceptance.md，形成可审计的文档链。</desc>
  <style>
    .file { rx: 8; stroke-width: 1.5; }
    .file-label { fill: #fff; font-weight: 600; font-size: 13px; text-anchor: middle; }
    .file-from { fill: #888; font-size: 10px; text-anchor: middle; }
    .arrow { stroke: #9aa0ad; stroke-width: 2; fill: none; marker-end: url(#afc); }
    .anno { fill: #666; font-size: 11px; text-anchor: middle; }
  </style>
  <defs>
    <marker id="afc" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#9aa0ad"/></marker>
  </defs>

  <rect x="0" y="0" width="820" height="260" fill="#fafbfc" rx="8"/>
  <text x="410" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">Phase 间的信息传递 — 可审计的文件链</text>

  <!-- File 1: spec.md -->
  <rect x="30" y="60" width="130" height="65" class="file" stroke="#4f97ff" fill="#4f97ff"/>
  <text x="95" y="88" class="file-label">spec.md</text>
  <text x="95" y="108" fill="rgba(255,255,255,.8)" font-size="10.5" text-anchor="middle">需求文档</text>
  <text x="95" y="145" class="file-from">← Phase 1 Spec</text>
  <line x1="160" y1="92" x2="195" y2="92" class="arrow"/>

  <!-- File 2: plan.md -->
  <rect x="195" y="60" width="130" height="65" class="file" stroke="#7ab2ff" fill="#7ab2ff"/>
  <text x="260" y="88" class="file-label">plan.md</text>
  <text x="260" y="108" fill="rgba(255,255,255,.8)" font-size="10.5" text-anchor="middle">方案 + 任务列表</text>
  <text x="260" y="145" class="file-from">← Phase 2 Plan</text>
  <line x1="325" y1="92" x2="360" y2="92" class="arrow"/>

  <!-- File 3: src/ + tests/ -->
  <rect x="360" y="60" width="130" height="65" class="file" stroke="#0a7c2e" fill="#0a7c2e"/>
  <text x="425" y="88" class="file-label">src/ + tests/</text>
  <text x="425" y="108" fill="rgba(255,255,255,.8)" font-size="10.5" text-anchor="middle">代码 + 测试</text>
  <text x="425" y="145" class="file-from">← Phase 3 Build</text>
  <line x1="490" y1="92" x2="525" y2="92" class="arrow"/>

  <!-- File 4: review.md -->
  <rect x="525" y="60" width="130" height="65" class="file" stroke="#e8a838" fill="#e8a838"/>
  <text x="590" y="88" class="file-label">review.md</text>
  <text x="590" y="108" fill="rgba(255,255,255,.8)" font-size="10.5" text-anchor="middle">审查报告</text>
  <text x="590" y="145" class="file-from">← Phase 4 Review</text>
  <line x1="655" y1="92" x2="690" y2="92" class="arrow"/>

  <!-- File 5: acceptance.md -->
  <rect x="660" y="60" width="140" height="65" class="file" stroke="#1a2233" fill="#1a2233"/>
  <text x="730" y="88" class="file-label">acceptance.md</text>
  <text x="730" y="108" fill="rgba(255,255,255,.8)" font-size="10.5" text-anchor="middle">验收报告</text>
  <text x="730" y="145" class="file-from">← Phase 5 Accept</text>

  <!-- Bottom annotations -->
  <line x1="95" y1="160" x2="95" y2="195" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="730" y1="160" x2="730" y2="195" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="95" y1="195" x2="730" y2="195" stroke="#ddd" stroke-width="1"/>
  <text x="410" y="215" class="anno">从需求到验收，每一步都有文档、可追溯、可回放</text>
  <text x="410" y="235" class="anno">Spec 的每一处模糊都会被 Loop 忠实地放大成错误的实现</text>
</svg>
